<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ADO 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<form id="calculadora" name="calculadora">
    <div class="linha">
        <label for="valor1" class="negrito">Valor 1:</label>
        <input type="text" id="valor1" name="valor1">
    </div>
    <div class="linha">
        <label for="valor2" class="negrito">Valor 2:</label>
        <input type="text" id="valor2" name="valor2">
    </div>

    <div class="negrito margem-top">Opções:</div>
    <div>
        <input type="radio" id="soma" name="operacao" value="soma">
        <label for="soma">SOMA</label><br>

        <input type="radio" id="subtracao" name="operacao" value="subtracao">
        <label for="subtracao">SUBTRAÇÃO</label><br>

        <input type="radio" id="multiplicacao" name="operacao" value="multiplicacao">
        <label for="multiplicacao">MULTIPLICAÇÃO</label><br>

        <input type="radio" id="divisao" name="operacao" value="divisao">
        <label for="divisao">DIVISÃO</label>
    </div>

    <div class="negrito margem-top">
        <label for="resultado">Resultado:</label>
    </div>
    <div>
        <input type="text" id="resultado" name="resultado" class="input-resultado">
    </div>

    <div class="margem-top">
        <button type="button" id="calcular" name="calcular">Calcular</button>
    </div>
</form>

</body>
</html>
