<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pokemarket</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="shared/header/header.css">
    <link rel="stylesheet" href="shared/vitrine/vitrine.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- pre-carrega as fontes do google -->
</head>

<body>
<!--tag que vai ser injetada via .js, o "data-raiz" identifica quantos niveis precisam voltar para chegar na raiz, atributo utilizado no js para consertar erro de caminho-->
    <header id="navbar" data-raiz=""></header>

<!--caixas simples para definir a caixa principal e a barra do lote-->
    <main class="main-container">
        <section class="barra-lote">
            <div>
                <h1>Lote atual</h1>
                <p>Mercado clandestino de Pokémons</p>
            </div>
            <button type="button" id="atualizar" onclick="gerarNovoLote()">Atualizar</button>
        </section>

<!-- vitrine injetada via js-->
        <section id="vitrine" class="grid-cartas">
            <p>Carregando....</p>
        </section>
    </main>

    <!--injeta a header na tag via js/-->
    <script src="shared/header/header.js"></script>
    <!--injeta a vitrine na tag via js/-->
    <script src="shared/vitrine/vitrine.js"></script>
</body>
</html>
